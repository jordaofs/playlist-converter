# Publishes the image and deploys it to the maintainer's server.
#
# Security model (this repository is public):
# - Runs only for pushed version tags; never for pull requests or forks.
# - The deploy job waits for a required reviewer on the `production`
#   environment; its secrets are released only after that approval.
# - The deploy job runs no third-party action and no checkout. Its SSH key is
#   restricted on the server to a single command that accepts an image digest.
# - Server details live in environment secrets, which GitHub masks in logs.
name: Release
on:
  push:
    tags: ["v*"]
permissions: {}
concurrency:
  group: release-production
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_SOURCE_URL=https://github.com/${{ github.repository }}
            VITE_SITE_URL=https://playlist-converter.jfs-cloud.com
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
  deploy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions: {}
    steps:
      - name: Deploy the approved image digest
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Build did not produce a valid image digest" >&2
            exit 1
          fi
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$dir/known_hosts"
          ssh -i "$dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$dir/known_hosts" \
            -o LogLevel=ERROR "$DEPLOY_USER@$DEPLOY_HOST" "$DIGEST"
